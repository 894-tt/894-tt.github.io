<style>
/* Sonnet UI Base & Flexible Full-Screen Grid */
:root{--bg:#f8f8ff;--bar:#eceef3;--ink:#1c1b1f;--sub:#49454f;--line:#ccc;--acc:#d3e3fd;--warn:#d93025;
--c0:#ffe0e0;--c1:#e0eeff;--c2:#e8e0f8;--c3:#ffeedd;--c4:#e6f6e0;--c5:#fff7cc;--c6:#e5e5e5;--c7:#dff6f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;background:#c9ccd4;color:var(--ink);display:flex;justify-content:center}

/* 全画面化設定 */
#app{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 24px #0003}
@media(min-width:900px){#app{max-width:100%;height:100%;margin:0;border-radius:0}} 

/* 余白削減 & Flex可変長レイアウト */
#main{flex:1;overflow:auto;display:flex;flex-direction:column;padding-bottom:76px;}

header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bar)}
header h1{font-size:18px;font-weight:500;margin:0 0 0 6px;flex:1;cursor:pointer;position:relative;text-align:center;}
header input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.ib{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
.ib:hover{background:#0001}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:32px;height:32px;border-radius:50%;background:#5b7fc7;color:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer}

/* PC向け移動ボタン（スマホ幅では非表示にしてスワイプ優先） */
#bPrev, #bNext { display: none; }
@media(min-width:480px){ #bPrev, #bNext { display: grid; } }

/* Flat Grid Table System */
.hd{text-align:center;font-size:12px;color:var(--sub);line-height:1.2;background:var(--bg);position:sticky;top:0;z-index:2;padding:4px 0;}
.hd b{display:block;font-size:20px;font-weight:500;color:var(--ink)}
.hd.today b{color:#fff;background:#1a73e8;border-radius:50%;width:32px;height:32px;line-height:32px;margin:2px auto 0}
.lab{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);padding:2px;background:var(--bg);}
.cell{background:var(--bg);padding:2px;min-width:0;height:100%;}

.card{height:100%;border:1.5px solid #0002;border-radius:8px;padding:4px 8px;cursor:pointer;overflow:hidden;position:relative;display:flex;flex-direction:column;gap:2px;}
.card.warn{border-color:var(--warn);box-shadow:0 0 0 2px #d9302544}
.card.warn::after{content:"！";position:absolute;right:6px;top:3px;color:var(--warn);font-weight:700}
.card .t{font-weight:700;font-size:16px;line-height:1.2}
.card .d{font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#222;}
.compact-card .t{font-size:16px;} .compact-card .d{display:none;}
.empty{height:100%;border-radius:8px}

.fab{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:16px;border:1.5px solid #0003;background:var(--acc);font-size:28px;cursor:pointer;box-shadow:0 3px 8px #0003;z-index:3;display:grid;place-items:center}
.scrim{position:absolute;inset:0;background:#0006;z-index:10;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,82%);background:var(--bar);border-radius:0 20px 20px 0;z-index:11;transform:translateX(-102%);transition:transform .22s;overflow:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#drawer.on{transform:none}
.logo{display:block;width:100%;height:auto;max-height:160px;object-fit:contain;margin:0 0 12px;background:#0ff;min-height:40px}
.mi{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:14px 16px;border-radius:28px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.mi.on{background:var(--acc)}
.mi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
hr{border:0;border-top:1px solid #0002;margin:6px 0}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,640px);max-height:90vh;color:var(--ink);box-shadow:0 12px 32px rgba(0,0,0,0.3)}
dialog::backdrop{background:#0006}
.dlg{padding:18px;display:flex;flex-direction:column;gap:10px}
.dlg h2{margin:0;font-size:18px}
.dlg label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
input,textarea,select{font:inherit;font-size:14px;padding:8px;border:1px solid #999;border-radius:8px;background:#fff;min-width:0;width:100%}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:20px;padding:10px 18px;background:#1a73e8;color:#fff;font-size:14px;cursor:pointer}
.btn.g{background:#e8eaf0;color:var(--ink)}.btn.r{background:#fce8e6;color:var(--warn)}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:26px;height:26px;border-radius:50%;border:2px solid #666;cursor:pointer}.sw i.on{outline:3px solid #1a73e8}
#classPickerWrap select{background:#fff;border:1px solid #c5c8d0;border-radius:10px;padding:9px 10px;font-size:13px;color:var(--ink)}
#classPickerWrap select:focus{outline:2px solid #1a73e8;outline-offset:1px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;display:none;max-width:90%}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px}
.mg div{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;cursor:pointer;font-size:14px;position:relative}
.mg div:hover{background:var(--acc)}.mg .today{background:#1a73e8;color:#fff}
.mg .dot{position:absolute;bottom:4px;width:4px;height:4px;background:#ea4335;border-radius:50%}
.sch h3{margin:12px 14px 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.sch p{margin:2px 18px;font-size:13px}

.check-row { display: flex; align-items: center; gap: 9px; font-size: 13px; flex-direction: row !important; }
.import-preview { width: 100%; max-height: 200px; object-fit: contain; background: #eee; border-radius: 8px; border: 1px solid #ccc; margin:8px 0; }
.progress { height: 6px; background: #e8eaf0; border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; width: 0; background: #1a73e8; transition: width .15s; }
.editor-table-wrap { overflow: auto; border: 1px solid #ccc; border-radius: 8px; max-height: 40vh; }
.editor-table { border-collapse: collapse; width: 100%; min-width: 800px; font-size: 12px; }
.editor-table th, .editor-table td { border-bottom: 1px solid #ddd; padding: 6px; text-align: left; vertical-align: top; }
.editor-table th { background: #f4f6fa; position: sticky; top: 0; z-index: 1; }
.editor-table input, .editor-table select { width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 4px; font-size:12px; }
.editor-table .remove-row { border: 0; background: transparent; color: var(--warn); font-size: 16px; cursor:pointer; }
.slot-stack { display: flex; flex-direction: column; gap: 4px; }
.import-details { display: grid; gap: 4px; }
.import-details label { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 4px; flex-direction: row; }
.muted { font-size: 12px; color: var(--sub); }
.help { font-size: 11px; color: #666; margin-top:2px; }
</style>
</head>

<script>
'use strict';

/* ===== Data & Constants ===== */
const STORAGE_KEY = 'timetable-integrated-v3'; 
const DEFAULT_GEMINI_MODEL = 'gemini-3.8-flash';

/* ===== Firebase / Gemini 接続設定 =====
   Firebase Web config は公開情報です。認証を使わないため、Firestore Security Rules は公開アクセスを許可する設定になります。
   クラス名は Firestore の classes コレクションの各ドキュメントに name として保存します。認証機能は使用しません。
   Gemini APIキーはHTMLへ埋め込まず、Cloudflare WorkerのSecret GEM_APIを使用します。
*/
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyC6CbskpDvmRTt7qzSTNyJC-Ui2VPis4fU',
  authDomain: 'timetable-894.firebaseapp.com',
  projectId: 'timetable-894',
  storageBucket: 'timetable-894.firebasestorage.app',
  messagingSenderId: '86547159658',
  appId: '1:86547159658:web:481bc85ef64bf5f8418813',
  measurementId: 'G-Z5T1YPESNJ'
};
const GEMINI_PROXY_URL = 'https://timetable-gem-api.timetableapp-info.workers.dev/api/timetable';

/* ===== PWA通知設定 =====
   VAPID公開鍵はCloudflare Workerに設定したものと同じ値にします。
   秘密鍵は絶対にHTMLへ書かず、Cloudflare Worker Secretに保存してください。
*/
const PUSH_API_BASE = 'https://timetable-gem-api.timetableapp-info.workers.dev';
const PUSH_VAPID_PUBLIC_KEY = 'BHb61PudUnTyVeeytNRLrpdDfuzrBF-ItwdVxQt-LgFMIDa8DbMfRzO0h4tTVU5NUGuechxfyT9FmsXRS6F853A';
const PUSH_STORAGE_KEY = 'timetable-push-device-v1';
const PUSH_DEFAULTS = { enabled:false, time:'20:00', days:[0,1,2,3,4,5,6], include:{items:true,homework:true,quiz:true,location:false,forgotten:true,notes:false,schedule:true}, sound:true };

/* ===== 教科別カラー定義エリア =====
   教科名をキーにして色を指定します。未登録の教科は従来の色選択を使用します。
   例: '国語': '#ffe0e0', '数学Ⅰ': '#e0eeff'
*/
const SUBJECT_COLORS = {
  '国語': '#ffe0e0',
  '数学Ⅰ': '#e0eeff',
  '数学': '#e0eeff',
  '英コミュⅠ': '#e8e0f8',
  '英語': '#e8e0f8',
  '地理総合': '#ffeedd',
  '生物基礎': '#e6f6e0',
  '化学基礎': '#e6f6e0',
  '体育': '#e5e5e5'
};
const GEMINI_MODELS = [
  {value:'gemini-3.8-flash', label:'Gemini 3.8 Flash（高性能）'},
  {value:'gemini-3.6-flash', label:'Gemini 3.6 Flash（推奨）'},
  {value:'gemini-3.5-flash-lite', label:'Gemini 3.5 Flash-Lite（軽量）'}
];

const PERIODS = [['朝','朝'],['1','1'],['2','2'],['3','3'],['4','4'],['昼休み','昼休み'],['5','5'],['6','6'],['7','7'],['放課後','放課後']];
const SLOTS = PERIODS.map(p=>p[0]);
const SLOT_INDEX = Object.fromEntries(SLOTS.map((s,i)=>[s,i]));
const DOW = ['日','月','火','水','木','金','土'];
const COLORS = ['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const COLOR_NAMES = ['ピンク','青','紫','オレンジ','緑','黄','グレー','水色'];

const makeId = () => (crypto?.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`);
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const clone = value => JSON.parse(JSON.stringify(value));
const $ = s => document.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

let state = {
  events: [], 
  view: 'day', 
  selectedDate: dateKey(new Date()), 
  settings: { logoUrl: LOGO_IMAGE_URL, geminiApiKey: '', geminiModel: DEFAULT_GEMINI_MODEL }
};
let ocrRunToken = 0;
let importRows = [];
let firebaseApp = null, firebaseDb = null;
let firebaseClasses = [];
let selectedClassId = localStorage.getItem('timetable-selected-class') || 'custom';
let pendingShareContext = null;

function addDays(d,n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const sameDay = (a,b) => dateKey(a) === dateKey(b);
function selectedDateObj() { const [y,m,d] = state.selectedDate.split('-').map(Number); return new Date(y,m-1,d); }

function seedEvents() {
  const mk = (slot,subject,colorIdx,items='',homework='',location='')=>({id:makeId(), dateKey:null, slot, endSlot:slot, subject, colorIdx, items, quiz:'', location, homework, notes:'', forgotten:'', allDay:false});
  const lessons = [
    mk('朝','朝練',6), mk('1','国語',0,'教科書、ノート','模試過去問'), mk('2','数学Ⅰ',1),
    mk('3','英コミュⅠ',2), mk('4','地理総合',3), mk('5','生物基礎',4,'','','理科室'),
    mk('6','化学基礎',4,'','','理科室'), mk('7','体育',6,'体育着','','体育館')
  ];
  
  const now = new Date();
  const mon = addDays(now, -((now.getDay()+6)%7)); 
  return lessons.flatMap(lesson => [0,1,2,3,4].map(dayOffset => ({...lesson, id:makeId(), dateKey: dateKey(addDays(mon, dayOffset))})));
}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (err) { console.warn(err); toast('保存容量の上限に達しました'); }
  if (pushDevice?.token && pushSettings.enabled) { clearTimeout(window.__pushSyncTimer); window.__pushSyncTimer=setTimeout(updatePushSnapshot,1200); }
}

function subjectColor(subject, fallbackIdx=0) {
  const key = String(subject || '').trim();
  return Object.prototype.hasOwnProperty.call(SUBJECT_COLORS, key)
    ? SUBJECT_COLORS[key]
    : COLORS[(Number(fallbackIdx)||0) % COLORS.length];
}

function setSyncStatus(message) {
  const el = $('#classSyncStatus');
  if (el) el.textContent = message;
}

async function initFirebase() {
  const configured = FIREBASE_CONFIG.apiKey !== 'YOUR_FIREBASE_WEB_API_KEY' &&
    FIREBASE_CONFIG.projectId !== 'YOUR_PROJECT_ID' &&
    FIREBASE_CONFIG.appId !== 'YOUR_FIREBASE_APP_ID';
  if (!configured || !window.firebase) {
    setSyncStatus('Firebase設定待ち');
    return false;
  }
  try {
    firebaseApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDb = firebase.firestore();
    await loadFirebaseClasses();
    setSyncStatus('Firebase接続済み');
    return true;
  } catch (err) {
    console.error('Firebase initialization failed:', err);
    setSyncStatus('Firebase接続エラー: ' + (err.message || '設定を確認してください'));
    return false;
  }
}

async function loadFirebaseClasses() {
  if (!firebaseDb) return;
  const snap = await firebaseDb.collection('classes').orderBy('name').get();
  firebaseClasses = snap.docs.map(doc => ({id:doc.id, name:doc.data().name || doc.id}));
  const select = $('#classSelect');
  const keep = selectedClassId;
  select.innerHTML = '<option value="custom">カスタム（同期しない）</option>' +
    firebaseClasses.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  if (firebaseClasses.some(c => c.id === keep)) select.value = keep;
  else { selectedClassId = 'custom'; select.value = 'custom'; }
  localStorage.setItem('timetable-selected-class', selectedClassId);
}

async function readClassSchedule(classId) {
  if (!firebaseDb) throw new Error('Firebaseに接続されていません');
  const ref = firebaseDb.collection('classes').doc(classId).collection('schedule').doc('current');
  const snap = await ref.get();
  if (!snap.exists) return [];
  const data = snap.data();
  return Array.isArray(data.events) ? data.events : [];
}

async function writeClassSchedule(classId, events) {
  if (!firebaseDb) throw new Error('Firebaseに接続されていません');
  const ref = firebaseDb.collection('classes').doc(classId).collection('schedule').doc('current');
  await ref.set({
    events: clone(events),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function syncFromFirebase(showMessage=true) {
  if (selectedClassId === 'custom') {
    if (showMessage) toast('カスタム時間割は同期されません');
    return;
  }
  try {
    setSyncStatus('同期データを取得中...');
    const events = await readClassSchedule(selectedClassId);
    state.events = events;
    persist(); render();
    setSyncStatus('同期済み: ' + (firebaseClasses.find(c=>c.id===selectedClassId)?.name || selectedClassId));
    if (showMessage) toast('クラスの時間割を更新しました');
  } catch (err) {
    console.error(err);
    setSyncStatus('同期失敗');
    if (showMessage) toast('同期できませんでした: ' + err.message, 5000);
  }
}

function askShareToClass(defaultClassId=selectedClassId, onComplete=null) {
  if (!firebaseDb || !firebaseClasses.length) {
    if (onComplete) onComplete(false);
    return;
  }
  const options = firebaseClasses.map(c =>
    `<option value="${esc(c.id)}" ${c.id===defaultClassId?'selected':''}>${esc(c.name)}</option>`
  ).join('');

    } catch(err) {
      console.error(err); btn.disabled = false; btn.textContent = '共有する';

    }

}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) {
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.events)) {
        const now = new Date();
        const mon = addDays(now, -((now.getDay()+6)%7));
        parsed.events = parsed.events.map(e => {
            if (!e.dateKey && e.weekday != null) {
                e.dateKey = dateKey(addDays(mon, e.weekday - 1));
                delete e.weekday;
            }
            return e;
        });
        state = {...state, ...parsed, settings:{...state.settings, ...(parsed.settings||{})}};
        return;
      }
    }
  } catch(e) {}
  state.events = seedEvents();
}

function toast(t, ms=2600) { 
  const e=$('#toast'); e.textContent=t; e.style.display='block'; 
  clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',ms); 
}

function sameDayEvents(date) {
  const dStr = dateKey(date);
  return state.events.filter(e => e.dateKey === dStr)
                     .sort((a,b)=>(SLOT_INDEX[a.slot]??0)-(SLOT_INDEX[b.slot]??0));
}
function eventSpan(e) { return e.allDay ? SLOTS.length : Math.max(1, (SLOT_INDEX[e.endSlot]??SLOT_INDEX[e.slot]??0) - (SLOT_INDEX[e.slot]??0) + 1); }

/* ===== 描画 (Flexible Grid) ===== */
function cardHtml(c, isCompact=false) {
  if(!c) return `<div class="empty"></div>`;
  const alert = c.notes || c.forgotten;
  const lines = [c.location&&`所:${c.location}`, c.items&&`持:${c.items}`, c.homework&&`宿:${c.homework}`, c.quiz&&`小:${c.quiz}`, c.forgotten&&`忘:${c.forgotten}`, c.notes&&`備:${c.notes}`].filter(Boolean);
  const htmlLines = isCompact ? '' : lines.map(l=>`<div class="d">${esc(l)}</div>`).join('');
  
  return `<div class="card ${isCompact?'compact-card':''} ${alert?'warn':''}" data-id="${esc(c.id)}" style="background:${subjectColor(c.subject,c.colorIdx)};">
    <div class="t">${esc(c.subject)}</div>
    ${htmlLines}
  </div>`;
}

function renderGrid(nDays) {
  const base = selectedDateObj();
  let days = [];
  if(nDays === 7) { 
    const mon = addDays(base, -((base.getDay()+6)%7)); 
    for(let i=0;i<5;i++) days.push(addDays(mon,i)); 
  } else {
    for(let i=0;i<nDays;i++) days.push(addDays(base,i));
  }
  
  const g = `grid-template-columns:44px repeat(${days.length}, minmax(0, 1fr))`;
  // grid-template-rows に repeat(SLOTS.length, 1fr) を設定し、高さを flex: 1 で最大化する
  let h = `<div style="display:grid; ${g}; grid-template-rows: auto repeat(${SLOTS.length}, 1fr); gap:1px; background:var(--line); flex:1; min-height:500px;">`;
  
  h += `<div style="background:var(--bg);position:sticky;top:0;z-index:2"></div>`;
  days.forEach(dx => {
    h += `<div class="hd ${sameDay(dx,new Date())?'today':''}"><b>${dx.getDate()}</b>${DOW[dx.getDay()]}</div>`;
  });
  
  const skip = days.map(() => 0);
  
  SLOTS.forEach((slot, rIdx) => {
    const label = PERIODS.find(p=>p[0]===slot)[1];
    h += `<div class="lab">${label}</div>`;
    
    days.forEach((dx, cIdx) => {
      if (skip[cIdx] > 0) {
        skip[cIdx]--;
        return; 
      }
      
      const events = sameDayEvents(dx);
      const e = events.find(ev => ev.allDay ? slot === '朝' : ev.slot === slot);
      
      if (e) {
        const span = eventSpan(e);
        if (span > 1) skip[cIdx] = span - 1;
        const st = span > 1 ? `grid-row: span ${span};` : '';
        h += `<div class="cell" style="${st}">${cardHtml(e, nDays > 1)}</div>`;
      } else {
        h += `<div class="cell" data-d="${dateKey(dx)}" data-p="${slot}" data-empty="1"><div class="empty"></div></div>`;
      }
    });
  });
  
  h += `</div>`;
  if (nDays === 1 && sameDayEvents(days[0]).length === 0) {
    h = `<div style="padding:40px 20px;text-align:center;color:var(--sub)">予定はありません<br><br>右下の「＋」から追加できます</div>` + h;
  }
  $('#main').innerHTML = h;
}

function renderMonth() {
  const d = selectedDateObj();
  const y = d.getFullYear(), mo = d.getMonth(), first = new Date(y,mo,1), last = new Date(y,mo+1,0);
  let h = `<div class="mg" style="flex:1;">` + DOW.map(x=>`<span style="text-align:center;font-size:12px;color:var(--sub)">${x}</span>`).join('') + '<span></span>'.repeat(0);
  h += '<div style="visibility:hidden"></div>'.repeat(first.getDay());
  
  for(let i=1; i<=last.getDate(); i++){ 
    const x = new Date(y,mo,i);
    const count = sameDayEvents(x).length;
    h += `<div data-d="${dateKey(x)}" class="${sameDay(x,new Date())?'today':''}">${i}${count?`<div class="dot"></div>`:''}</div>`; 
  }
  $('#main').innerHTML = h + '</div>';
}

function renderSchedule() {
  const d = selectedDateObj();
  const mon = addDays(d, -((d.getDay()+6)%7)); 
  let h = '<div class="sch" style="flex:1;">';
  for(let i=0;i<7;i++){ 
    const x = addDays(mon,i);
    const evs = sameDayEvents(x);
    if(i>=5 && !evs.length) continue; 
    h += `<h3><span>${x.getMonth()+1}/${x.getDate()}（${DOW[x.getDay()]}）</span></h3>`;
    if(!evs.length) h += `<p class="muted">予定なし</p>`;
    evs.forEach(e => {
      const label = e.allDay ? '終日' : PERIODS.find(p=>p[0]===e.slot)[1];
      h += `<p data-id="${e.id}" style="cursor:pointer">${label} ${esc(e.subject)}${e.notes||e.forgotten?' ⚠':''}</p>`;
    });
  }
  $('#main').innerHTML = h + '</div>';
}

function render() {
  const d = selectedDateObj();
  $('#ttlT').textContent = `${d.getMonth()+1}月 ▾`; 
  $('#dp').value = state.selectedDate; 
  $('#tdn').textContent = new Date().getDate();
  document.querySelectorAll('.mi[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  $('#bAdd').style.display = (state.view==='month'||state.view==='schedule') ? 'none' : '';
  
  if(state.view === 'day') renderGrid(1);
  else if(state.view === '3day') renderGrid(3);
  else if(state.view === 'week') renderGrid(7);
  else if(state.view === 'month') renderMonth();
  else if(state.view === 'schedule') renderSchedule();
  persist();
}

/* ===== Push Notifications (認証なし・端末トークン方式) ===== */
let pushSettings = (() => {
  try { return {...PUSH_DEFAULTS, ...(JSON.parse(localStorage.getItem('timetable-push-settings-v1')||'{}'))}; }
  catch { return {...PUSH_DEFAULTS}; }
})();
let pushDevice = (() => {
  try { return JSON.parse(localStorage.getItem(PUSH_STORAGE_KEY)||'null'); } catch { return null; }
})();
let pushRegistration = null;
function b64urlToBytes(value) {
  const pad='='.repeat((4-value.length%4)%4);
  const raw=atob((value+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(raw,c=>c.charCodeAt(0));
}
function randomPushToken() {
  const bytes=crypto.getRandomValues(new Uint8Array(32));
  return [...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function ensurePushServiceWorker() {
  if (!('serviceWorker' in navigator)) throw new Error('このブラウザはService Workerに対応していません');
  if (!window.isSecureContext) throw new Error('HTTPSで開いてください');
  pushRegistration = await navigator.serviceWorker.register('./sw.js', {scope:'./'});
  await navigator.serviceWorker.ready;
  return pushRegistration;
}
async function pushApi(path, body, token=pushDevice?.token) {
  const headers={'Content-Type':'application/json'};
  if(token) headers.Authorization='Bearer '+token;
  const res=await fetch(PUSH_API_BASE+path,{method:'POST',headers,body:JSON.stringify(body)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||`通知サーバーエラー (${res.status})`);
  return data;
}
function upcomingPushEvents() {
  const today=dateKey(new Date());
  const until=dateKey(addDays(new Date(),9));
  return state.events.filter(e=>e.dateKey>=today && e.dateKey<=until).map(e=>({
    dateKey:e.dateKey,slot:e.slot,endSlot:e.endSlot,subject:e.subject,
    items:e.items||'',homework:e.homework||'',quiz:e.quiz||'',location:e.location||'',
    forgotten:e.forgotten||'',notes:e.notes||''
  }));
}
async function registerPushDevice() {
  if(!PUSH_VAPID_PUBLIC_KEY || PUSH_VAPID_PUBLIC_KEY.includes('ここに設定'))
    throw new Error('HTML内のPUSH_VAPID_PUBLIC_KEYにWorkerのVAPID公開鍵を設定してください');
  const reg=await ensurePushServiceWorker();
  if(!('PushManager' in window)) throw new Error('このブラウザはWeb Pushに対応していません');
  const permission=await Notification.requestPermission();
  if(permission!=='granted') throw new Error('通知が許可されませんでした。ブラウザの設定を確認してください');
  let subscription=await reg.pushManager.getSubscription();
  if(!subscription) subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToBytes(PUSH_VAPID_PUBLIC_KEY)});
  if(!pushDevice?.token) pushDevice={token:randomPushToken()};
  const settings={...pushSettings, enabled:true};
  await pushApi('/api/push/subscribe',{token:pushDevice.token,subscription:subscription.toJSON(),settings,events:upcomingPushEvents()},null);
  pushSettings=settings;
  localStorage.setItem(PUSH_STORAGE_KEY,JSON.stringify(pushDevice));
  localStorage.setItem('timetable-push-settings-v1',JSON.stringify(pushSettings));
  return true;
}
async function updatePushSnapshot() {
  if(!pushDevice?.token || !pushSettings.enabled) return;
  try { await pushApi('/api/push/schedule',{events:upcomingPushEvents()}); }
  catch(err) { console.warn('Push schedule sync failed:',err); }
}
async function disablePushDevice() {
  if(pushDevice?.token) {
    try { await pushApi('/api/push/unsubscribe',{}); } catch(err) { console.warn(err); }
  }
  try { const reg=await navigator.serviceWorker.getRegistration('./'); const sub=await reg?.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); } catch(err) { console.warn(err); }
  pushSettings.enabled=false;
  localStorage.setItem('timetable-push-settings-v1',JSON.stringify(pushSettings));
  pushDevice=null; localStorage.removeItem(PUSH_STORAGE_KEY);
}

};

const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));

async function share() {
  const payload = {events: state.events};
  const url = location.href.split('?')[0] + '?s=' + b64e(payload);
  try{ if(navigator.share){ await navigator.share({title:'時間割',url}); return; } await navigator.clipboard.writeText(url); toast('共有URLをコピーしました'); }
  catch{ prompt('共有URL (コピーしてください)', url); }
}

function checkIncoming(){
  const s = new URLSearchParams(location.search).get('s'); if(!s) return;
  try{
    const inc = b64d(s);
    if(inc && Array.isArray(inc.events)) {
      openModal('共有された時間割', `<p>取り込みますか？（既存の予定に追加されます）</p><div class="btns"><button class="btn g" id="i_x">キャンセル</button><button class="btn" id="i_ok">取り込む</button></div>`);
      const dlg = $('#dlg');
      dlg.querySelector('#i_x').onclick = () => { history.replaceState(null,'',location.pathname); closeModal(); };
      dlg.querySelector('#i_ok').onclick = () => { 
        const imported = inc.events.map(e=>({...e, id:makeId()}));
        state.events.push(...imported); persist(); render(); history.replaceState(null,'',location.pathname); closeModal(); toast('取り込みました'); askShareToClass(); 
      };
    }
  }catch{ toast('URLを読み取れませんでした'); }
}

/* ===== OCR / Gemini Import ===== */
function prepareGeminiImage(file) {
  return new Promise((resolve,reject)=>{
    const objectUrl=URL.createObjectURL(file); const image=new Image();
    image.onload=()=>{
      try {
        const maxSide=2000, scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
        const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(image.naturalWidth*scale)); canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        const ctx=canvas.getContext('2d'); ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
        const dataUrl=canvas.toDataURL('image/jpeg',0.9); URL.revokeObjectURL(objectUrl);
        resolve({preview:dataUrl,mimeType:'image/jpeg',base64:dataUrl.split(',')[1]});
      } catch(e){URL.revokeObjectURL(objectUrl);reject(e);}
    };
    image.onerror=reject; image.src=objectUrl;
  });
}

function mapGeminiSlot(v, fb='1') {
  const s = String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/限|目/g,'');
  if(SLOTS.includes(s)) return s;
  if(/朝/.test(s)) return '朝'; if(/昼/.test(s)) return '昼休み'; if(/放課/.test(s)) return '放課後';
  const m = s.match(/[1-7]/); return m ? m[0] : fb;
}

// 簡易OCR（Tesseract.js）
async function loadScript(src){ return new Promise((ok,ng)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ng; document.head.appendChild(s); }); }
async function runTesseractOCR(file, previewUrl) {
  const token = ocrRunToken;
  $('#ocrP').src = previewUrl;
  $('#dlg').querySelector('.muted').textContent = 'Tesseract.js を読み込んでいます...';
  try {
    if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    if(token !== ocrRunToken) return;
    
    $('#dlg').querySelector('.muted').textContent = '画像を文字認識中...';
    const { data:{ text } } = await Tesseract.recognize(file, 'jpn', {
      logger: m => {
        if(m.status === 'recognizing text' && m.progress && $('#ocrProg')) {
          $('#ocrProg').style.width = `${Math.round(m.progress * 100)}%`;
        }
      }
    });
    
    if(token !== ocrRunToken) return;
    
    const lines=text.split(/\r?\n/).map(s=>s.replace(/\s+/g,'')).filter(s=>s.length>0&&s.length<20);
    let period=1;
    importRows = [];
    lines.forEach((line) => {
       if(/^(月|火|水|木|金|土|日|曜)/.test(line)) return; 
       importRows.push({
         date: state.selectedDate, 
         slot: String(Math.min(7, period)),
         endSlot: String(Math.min(7, period)),
         subject: line.replace(/^[・:：\-]+/,''),
         items:'', location:'', notes:'', homework:'', quiz:'', forgotten:'', allDay:false
       });
       period++; if(period>7) period=1;
    });
    showImportEditor(previewUrl);
    toast('簡易OCR結果です。設定でGemini APIキーを登録すると精度が大幅に上がります。', 6000);

  } catch(e) {
    if(token === ocrRunToken) {
      $('#dlg').querySelector('.muted').textContent = 'Tesseractエラー: ' + e.message;
      $('#dlg').innerHTML += `<div class="btns"><button class="btn g" onclick="closeModal()">閉じる</button></div>`;
    }
  }
}

async function runOCR(file) {
  const apiKey = state.settings.geminiApiKey;
  const token = ++ocrRunToken;
  
  openModal('解析中...', `<img class="import-preview" id="ocrP"><div class="progress"><div id="ocrProg" style="width:10%"></div></div><p class="muted">画像を準備しています...</p>`);
  
  try {
    const img = await prepareGeminiImage(file);
    if(token !== ocrRunToken) return;
    
    // 手動APIキーが空の場合もCloudflare Worker経由でGeminiを利用する。
    // Workerが利用できない場合に限り、下のcatchでエラーを表示する。
    $('#ocrP').src = img.preview;
    $('#ocrProg').style.width = '50%';
    $('#dlg').querySelector('.muted').textContent = 'Geminiで画像を解析しています...';
    
    const base = selectedDateObj();
    const mon = addDays(base, -((base.getDay()+6)%7));
    const year = base.getFullYear();

    const prompt = `あなたは学校時間割画像を構造化データへ変換する専門家です。
画像から全ての日付とコマの情報を抽出し、JSONで出力してください。
基準となる週の月曜日は ${dateKey(mon)} です。
画像内に日付(例: 10/26, 2日)がある場合は、${year}年のその日付(YYYY-MM-DD)に正確に変換してください。
曜日しか書かれていない場合は、基準となる週の該当する日付に割り当ててください。
結合セルはallDay=trueまたはslotとendSlotで表現してください。
JSON出力形式:
{"lessons":[{"date":"2026-10-26","slot":"1","endSlot":"1","subject":"国語","location":"","items":"","homework":"","quiz":"","notes":"","forgotten":"","allDay":false}]}
マークダウンや余計なテキストは含めないでください。`;
    
    const requestBody = {
      model: state.settings.geminiModel,
      prompt,
      image: { mimeType: img.mimeType, data: img.base64 }
    };
    // 手動APIキーが入力されている場合のみ直接APIを使用。未入力時はWorker Secret GEM_APIを使用。
    const requestUrl = apiKey
      ? `https://generativelanguage.googleapis.com/v1beta/models/${state.settings.geminiModel}:generateContent?key=${encodeURIComponent(apiKey)}`
      : GEMINI_PROXY_URL;
    const requestPayload = apiKey ? {
      contents: [{parts:[{text:prompt},{inlineData:{mimeType:img.mimeType,data:img.base64}}]}],
      generationConfig: {responseMimeType:'application/json'}
    } : requestBody;
    const res = await fetch(requestUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(requestPayload)
    });
    
    const payload = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(payload?.error?.message || `HTTP Error ${res.status}`);
    
    const text = (payload?.candidates?.[0]?.content?.parts||[]).map(p=>p.text).join('') || payload?.text || payload?.result || '';
    if(!text) throw new Error('Geminiからの応答が空でした。');
    
    const jsonStr = text.match(/\{[\s\S]*\}/)?.[0] || text;
    const parsed = JSON.parse(jsonStr);
    
    importRows = (parsed.lessons||[]).map(r => {
      let sl = mapGeminiSlot(r.slot); let esl = mapGeminiSlot(r.endSlot, sl);
      if(r.allDay) { sl='朝'; esl='放課後'; }
      if((SLOT_INDEX[esl]??0) < (SLOT_INDEX[sl]??0)) esl = sl;
      
      let d = r.date || state.selectedDate;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d = state.selectedDate;

      return {
        date: d, slot:sl, endSlot:esl, subject:(r.subject||'').toString(),
        items:(r.items||'').toString(), location:(r.location||'').toString(), notes:(r.notes||'').toString(), 
        homework:(r.homework||'').toString(), quiz:(r.quiz||'').toString(), forgotten:(r.forgotten||'').toString(), allDay:!!r.allDay
      };
    }).filter(r=>r.subject);
    
    if(importRows.length === 0) throw new Error('教科を検出できませんでした。');
    
    showImportEditor(img.preview);
  } catch(e) {
    console.error(e);
    if(token === ocrRunToken) {
      $('#dlg').querySelector('.muted').textContent = 'エラー: ' + e.message;
      $('#dlg').innerHTML += `<div class="btns">
        <button class="btn" id="btnFallback">Tesseractで再試行</button>
        <button class="btn g" onclick="closeModal()">閉じる</button>
      </div>`;
      const fallbackBtn = document.getElementById('btnFallback');
      if(fallbackBtn) fallbackBtn.onclick = () => runTesseractOCR(file, URL.createObjectURL(file));
    }
  }
}

function showImportEditor(preview) {
  const slOpts = (v) => SLOTS.map(s=>`<option value="${s}" ${v===s?'selected':''}>${PERIODS.find(p=>p[0]===s)[1]}</option>`).join('');
  
  const trs = importRows.map((r,i) => `<tr>
    <td><input type="date" style="width:115px;padding:4px;font-size:11px;" data-i="${i}" data-k="date" value="${esc(r.date)}"></td>
    <td><div class="slot-stack"><select data-i="${i}" data-k="slot">${slOpts(r.slot)}</select><select data-i="${i}" data-k="endSlot">${slOpts(r.endSlot)}</select></div></td>
    <td><input data-i="${i}" data-k="subject" value="${esc(r.subject)}"></td>
    <td><div class="import-details">
      <label>持<input data-i="${i}" data-k="items" value="${esc(r.items)}"></label>
      <label>宿<input data-i="${i}" data-k="homework" value="${esc(r.homework)}"></label>
      <label>所<input data-i="${i}" data-k="location" value="${esc(r.location)}"></label>
      <label>小<input data-i="${i}" data-k="quiz" value="${esc(r.quiz)}"></label>
      <label>備<input data-i="${i}" data-k="notes" value="${esc(r.notes)}"></label>
    </div></td>
    <td><button class="remove-row" data-rm="${i}">×</button></td>
  </tr>`).join('');

  const body = `
  <p class="help">誤りや日付ずれがあれば修正してください。</p>
  <img class="import-preview" src="${preview}">
  <div class="editor-table-wrap"><table class="editor-table">
    <thead><tr><th>日付</th><th>コマ</th><th>教科名</th><th>詳細</th><th></th></tr></thead>
    <tbody id="iBody">${trs}</tbody>
  </table></div>
  <label class="check-row" style="margin: 12px 0 4px;"><input type="checkbox" id="i_replace" checked> 読み込んだ日付にある既存の予定を削除して上書きする</label>
  <div class="btns">
    <button class="btn g" id="i_add">行を追加</button>
    <button class="btn g" id="i_x">キャンセル</button>
    <button class="btn" id="i_ok">登録 (${importRows.length}件)</button>
  </div>`;
  
  openModal('読み込み結果の確認', body);
  const dlg = $('#dlg');
  
  const bindEvents = () => {
    dlg.querySelectorAll('[data-k]').forEach(el => {
      el.onchange = () => { importRows[el.dataset.i][el.dataset.k] = el.value; };
    });
    dlg.querySelectorAll('[data-rm]').forEach(el => {
      el.onclick = () => { importRows.splice(el.dataset.rm, 1); showImportEditor(preview); };
    });
  };
  bindEvents();
  
  dlg.querySelector('#i_add').onclick = () => {
    importRows.push({ date:state.selectedDate, slot:'1', endSlot:'1', subject:'', items:'', location:'', homework:'', quiz:'', notes:'', forgotten:'', allDay:false });
    showImportEditor(preview);
  };
  dlg.querySelector('#i_x').onclick = closeModal;
  
  dlg.querySelector('#i_ok').onclick = () => {
    const replace = dlg.querySelector('#i_replace').checked;
    if (replace) {
      const importedDates = new Set(importRows.map(r => r.date));
      state.events = state.events.filter(e => !importedDates.has(e.dateKey));
    }
    
    let addedCount = 0;
    importRows.forEach(r => {
      const sub = (r.subject || '').toString().trim();
      const d = r.date || state.selectedDate;
      if(!sub) return; 
      state.events.push({
        id: makeId(), dateKey: d,
        slot: r.slot, endSlot: r.endSlot, subject: sub,
        colorIdx: (SLOT_INDEX[r.slot]||0)%COLORS.length, items: r.items, location: r.location,
        quiz: r.quiz, homework: r.homework, notes: r.notes, forgotten: r.forgotten || '', allDay:r.allDay
      });
      addedCount++;
    });
    
    if (addedCount > 0) {
      state.selectedDate = importRows[0].date;
      state.view = 'week';
    }
    
    persist(); render(); closeModal(); toast(`${addedCount}件登録しました`);
    if (addedCount > 0) askShareToClass();
  };
}

/* ===== Events & Navigation ===== */
function moveDate(dir) {
  const step = state.view==='week'?7:state.view==='3day'?3:state.view==='month'?30:1;
  if (state.view === 'month') {
    const d = selectedDateObj();
    d.setMonth(d.getMonth() + dir);
    state.selectedDate = dateKey(d);
  } else if (state.view === 'schedule') {
    state.selectedDate = dateKey(addDays(selectedDateObj(), dir * 7));
  } else {
    state.selectedDate = dateKey(addDays(selectedDateObj(), dir * step));
  }
  render();
}

$('#bPrev').onclick = () => moveDate(-1);
$('#bNext').onclick = () => moveDate(1);

const drawer = on => { $('#drawer').classList.toggle('on',on); $('#scrim').classList.toggle('on',on); };
$('#bMenu').onclick = () => drawer(true);
$('#scrim').onclick = () => drawer(false);
document.querySelectorAll('.mi[data-v]').forEach(b => b.onclick = () => { state.view = b.dataset.v; drawer(false); render(); });
$('#mSet').onclick = () => { drawer(false); openSettings(); };
$('#mNotify').onclick = () => { drawer(false); openNotificationSettings(); };
$('#bSettings').onclick = openSettings;

$('#bToday').onclick = () => { state.selectedDate = dateKey(new Date()); render(); };
$('#dp').onchange = e => { if(e.target.value){ state.selectedDate = e.target.value; render(); } };

$('#mOcr').onclick = () => { drawer(false); $('#file').click(); };
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value=''; if(f) runOCR(f); };

$('#bAdd').onclick = () => openEventEditor();

$('#main').onclick = e => {
  const card = e.target.closest('.card');
  if(card) return openEventEditor(card.dataset.id);
  const empty = e.target.closest('[data-empty]');
  if(empty) return openEventEditor(null, empty.dataset.p, empty.dataset.d || state.selectedDate);
  const p = e.target.closest('p[data-id]');
  if(p) return openEventEditor(p.dataset.id);
};

$('#bCheck').onclick = () => {
  const tmr = addDays(new Date(),1);
  const evs = sameDayEvents(tmr);
  const alerts = evs.filter(e=>e.notes||e.forgotten).map(e=>`${e.subject}: ${e.forgotten||e.notes}`);
  const items = [...new Set(evs.flatMap(e=>(e.items||'').split(/[、, ]/).filter(Boolean)))];
  toast(evs.length ? `明日の持ち物: ${items.join('、')||'なし'}${alerts.length?'\n⚠ '+alerts.join(' / '):''}` : '明日の予定はありません', 6000);
};

$('#bReload').onclick = async () => {
  if (selectedClassId === 'custom') { toast('カスタム時間割は同期されません'); return; }
  await syncFromFirebase(true);
};

$('#classSelect').onchange = async e => {
  selectedClassId = e.target.value || 'custom';
  localStorage.setItem('timetable-selected-class', selectedClassId);
  if (selectedClassId === 'custom') {
    setSyncStatus('カスタム（同期しない）');
    toast('カスタム時間割に切り替えました');
  } else {
    await syncFromFirebase(true);
  }
};

let sx = 0;
$('#main').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('#main').addEventListener('touchend', e => { 
  const dx = e.changedTouches[0].clientX - sx; 
  if(Math.abs(dx) > 80 && ['day','3day','week','month','schedule'].includes(state.view)){ 
    moveDate(dx < 0 ? 1 : -1);
  } 
});

/* ===== Init ===== */


load();
applyLogo();
render();
ensurePushServiceWorker().catch(err=>console.warn('PWA service worker:',err));
window.addEventListener('pageshow',()=>updatePushSnapshot());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') updatePushSnapshot();});
checkIncoming();
initFirebase().then(connected => {
  if (connected && selectedClassId !== 'custom') syncFromFirebase(false);
});

</script>
</body>
